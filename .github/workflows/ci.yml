name: Nfilas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Instalar e verificar dependências
        run: |
          python -m pip install -r requirements.deploy.txt
          python -m pip check
      - name: Executar testes Python
        env:
          PAINEL_DB_PATH: ${{ runner.temp }}/nfilas-ci.db
        run: python -m unittest discover -s tests -v
      - name: Executar testes JavaScript
        run: node --test tests/*.cjs
      - name: Verificar as unidades systemd da Oracle
        run: systemd-analyze verify deploy/oracle/nfilas-deploy.{service,timer}
